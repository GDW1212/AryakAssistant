<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <title>소셜 로그인</title>
    <style>
      body {
        font-family: sans-serif;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        margin: 0;
        background-color: #f4f4f4;
      }
      .login-container {
        text-align: center;
        background: white;
        padding: 40px;
        border-radius: 8px;
        box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
      }
      h1 {
        margin-bottom: 30px;
      }
      .login-btn {
        display: block;
        width: 300px;
        padding: 15px;
        margin: 10px 0;
        border: none;
        border-radius: 5px;
        color: white;
        font-size: 16px;
        text-decoration: none;
        font-weight: bold;
      }
      .google-btn {
        background-color: #db4437;
      }
      .kakao-btn {
        background-color: #fee500;
        color: #191919;
      }
      .naver-btn {
        background-color: #03c75a;
      }
    </style>
  </head>
  <body>
    <div class="login-container">
      <h1>소셜 계정으로 로그인</h1>
      <a href="/login/google" class="login-btn google-btn"
        >Google 계정으로 로그인</a
      >
      <a href="/login/kakao" class="login-btn kakao-btn"
        >Kakao 계정으로 로그인</a
      >
      <a href="/login/naver" class="login-btn naver-btn"
        >Naver 계정으로 로그인</a
      >
    </div>
  </body>
</html>
